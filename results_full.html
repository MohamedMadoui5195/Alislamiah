<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alislamiah - محتوى الموقع</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap');
        body { font-family: 'Cairo', sans-serif; background-color: #0f172a; color: #f8fafc; }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <!-- الشريط الثابت العلوي الخاص بصفحة عرض محتوى الموقع -->
    <header class="fixed top-0 left-0 right-0 bg-[#0f172a]/95 backdrop-blur-md shadow-lg z-50 border-b border-slate-800">
        <div class="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <a href="results.html" class="bg-slate-800 text-slate-300 hover:text-white px-3 py-1.5 rounded-lg text-xs font-bold transition">
                    <i class="fa-solid fa-arrow-right ml-1"></i> رجوع للنتائج
                </a>
                <div>
                    <h1 id="siteTitle" class="font-bold text-sm text-slate-100">جاري تحميل الموقع...</h1>
                    <span id="siteUrlText" class="text-[10px] text-emerald-400">--</span>
                </div>
            </div>
            <div>
                <a id="externalLink" href="#" target="_blank" class="bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-bold px-4 py-2 rounded-xl transition">
                    فتح الموقع في نافذة مستقلة <i class="fa-solid fa-external-link-alt mr-1"></i>
                </a>
            </div>
        </div>
    </header>

    <!-- منطقة عرض محتوى الموقع (تضم إطار عرض أو تفاصيل الموقع) -->
    <main class="flex-grow pt-20 flex flex-col w-full h-[calc(100vh-5rem)]">
        <!-- إطار لعرض الموقع داخل الصفحة (iframe) أو محتواه الداخلي -->
        <iframe id="siteFrame" src="" class="w-full flex-grow border-0 bg-white"></iframe>
    </main>

    <script>
        // استقبال البيانات الم تمررة من صفحة النتائج عبر الـ URL
        const params = new URLSearchParams(window.location.search);
        const title = params.get('title') || 'موقع غير معروف';
        const url = params.get('url') || 'https://www.google.com';

        document.getElementById('siteTitle').textContent = title;
        document.getElementById('siteUrlText').textContent = url;
        document.getElementById('externalLink').href = url;
        
        // ربط الإطار بعرض الموقع مباشرة مع بقاء الشريط الثابت بالأعلى
        document.getElementById('siteFrame').src = url;
    </script>
</body>
</html>
