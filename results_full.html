<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>نتائج البحث - Alislamiah</title>
    <link rel="icon" href="icon.png" type="image/png">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: #0a1628;
            color: #e8f0fe;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* ========== الشريط العلوي الثابت ========== */
        #top-bar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            background: rgba(8, 20, 42, 0.97);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(60, 120, 200, 0.25);
            padding: 10px 14px;
            display: flex;
            align-items: center;
            gap: 12px;
            box-shadow: 0 4px 20px rgba(0, 10, 30, 0.5);
        }

        .back-btn, .home-btn {
            background: none;
            border: none;
            color: #8bb8e8;
            font-size: 20px;
            cursor: pointer;
            padding: 6px 8px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s, color 0.2s;
            flex-shrink: 0;
        }

        .back-btn:active, .home-btn:active {
            background: rgba(40, 90, 160, 0.3);
            color: #fff;
        }

        .logo {
            font-weight: 700;
            font-size: 15px;
            color: #5eb0ff;
            white-space: nowrap;
            display: none;
        }

        @media (min-width: 500px) {
            .logo { display: block; }
        }

        .search-form {
            flex: 1;
            display: flex;
            align-items: center;
            background: rgba(15, 35, 65, 0.9);
            border: 1px solid rgba(80, 150, 230, 0.3);
            border-radius: 28px;
            padding: 8px 14px;
            gap: 8px;
            transition: border-color 0.2s, box-shadow 0.2s;
            max-width: 700px;
        }

        .search-form:focus-within {
            border-color: rgba(100, 180, 255, 0.6);
            box-shadow: 0 0 0 2px rgba(80, 150, 230, 0.2);
        }

        .search-form input {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: #e8f4ff;
            font-size: 15px;
            direction: rtl;
            min-width: 0;
        }

        .search-form input::placeholder {
            color: #6a8fb8;
        }

        .search-btn {
            background: none;
            border: none;
            color: #5eb0ff;
            font-size: 18px;
            cursor: pointer;
            padding: 2px;
            display: flex;
            align-items: center;
        }

        /* ========== المحتوى ========== */
        #main-content {
            margin-top: 68px;
            padding: 12px 14px 30px;
            max-width: 720px;
            margin-left: auto;
            margin-right: auto;
            transition: opacity 0.2s;
        }

        #main-content.hidden {
            display: none;
        }

        /* صندوق الرد الذكي */
        .ai-box {
            background: linear-gradient(145deg, rgba(8, 100, 200, 0.15), rgba(8, 60, 140, 0.08));
            border: 1px solid rgba(80, 160, 255, 0.25);
            border-radius: 16px;
            padding: 16px 18px;
            margin-bottom: 18px;
            display: none;
        }

        .ai-box.show {
            display: block;
        }

        .ai-header {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 8px;
            font-weight: 600;
            color: #5eb0ff;
            font-size: 14px;
        }

        .ai-badge {
            background: #087fff;
            color: #fff;
            font-size: 10px;
            padding: 2px 8px;
            border-radius: 12px;
            font-weight: 600;
        }

        .ai-content {
            color: #c8dcf0;
            font-size: 14px;
            line-height: 1.75;
        }

        /* بطاقات النتائج */
        .result-card {
            display: flex;
            align-items: flex-start;
            gap: 14px;
            background: rgba(12, 28, 52, 0.7);
            border: 1px solid rgba(50, 100, 180, 0.18);
            border-radius: 14px;
            padding: 14px 16px;
            margin-bottom: 10px;
            text-decoration: none;
            color: inherit;
            transition: background 0.2s, border-color 0.2s, transform 0.15s;
            cursor: pointer;
        }

        .result-card:hover, .result-card:active {
            background: rgba(18, 40, 75, 0.9);
            border-color: rgba(80, 150, 230, 0.4);
        }

        .favicon {
            width: 36px;
            height: 36px;
            border-radius: 10px;
            background: rgba(255,255,255,0.06);
            object-fit: contain;
            flex-shrink: 0;
            padding: 4px;
        }

        .result-body {
            flex: 1;
            min-width: 0;
        }

        .result-meta {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 4px;
            flex-wrap: wrap;
        }

        .result-type {
            font-size: 11px;
            background: rgba(30, 80, 160, 0.4);
            color: #6ec0ff;
            padding: 2px 8px;
            border-radius: 6px;
            font-weight: 500;
        }

        .result-url {
            font-size: 12px;
            color: #6a8fb8;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            max-width: 220px;
        }

        .result-title {
            font-size: 16px;
            font-weight: 600;
            color: #8ec8ff;
            margin-bottom: 4px;
            line-height: 1.35;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .result-desc {
            font-size: 13px;
            color: #9bb4d0;
            line-height: 1.5;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        /* فيديو */
        .video-card {
            display: flex;
            gap: 12px;
        }

        .video-thumb {
            position: relative;
            width: 140px;
            height: 80px;
            flex-shrink: 0;
            border-radius: 8px;
            overflow: hidden;
            background: #000;
        }

        .video-thumb img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .video-duration {
            position: absolute;
            bottom: 4px;
            left: 4px;
            background: rgba(0,0,0,0.8);
            color: #fff;
            font-size: 11px;
            padding: 1px 5px;
            border-radius: 3px;
        }

        .video-play {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.55);
            color: #fff;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
        }

        /* لا نتائج */
        .no-results {
            text-align: center;
            padding: 50px 20px;
            color: #6a8fb8;
        }

        .no-results .icon {
            font-size: 42px;
            margin-bottom: 12px;
            opacity: 0.5;
        }

        /* ========== إطار الموقع ========== */
        #site-frame-wrap {
            display: none;
            position: fixed;
            top: 60px;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: 900;
            background: #0a1628;
        }

        #site-frame-wrap.active {
            display: block;
        }

        #site-frame {
            width: 100%;
            height: 100%;
            border: none;
            background: #fff;
        }

        .frame-loading {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0a1628;
            color: #6a8fb8;
            font-size: 15px;
            z-index: 1;
        }
    </style>
</head>
<body>

    <!-- الشريط العلوي الثابت -->
    <header id="top-bar">
        <button class="back-btn" onclick="goBack()" title="رجوع">←</button>
        <button class="home-btn" onclick="goHome()" title="الرئيسية">🏠</button>
        <span class="logo">Alislamiah</span>
        <form class="search-form" onsubmit="doSearch(event)">
            <input type="text" id="searchInput" placeholder="ابحث في الإسلامية..." autocomplete="off">
            <button type="submit" class="search-btn">🔍</button>
        </form>
    </header>

    <!-- قائمة النتائج -->
    <main id="main-content">
        <div id="aiBox" class="ai-box">
            <div class="ai-header">
                <span>✦</span> رد الذكاء الاصطناعي
                <span class="ai-badge">Alislamiah AI</span>
            </div>
            <div id="aiText" class="ai-content"></div>
        </div>
        <div id="resultsList"></div>
    </main>

    <!-- إطار الموقع (يبقى الشريط العلوي ظاهراً) -->
    <div id="site-frame-wrap">
        <div class="frame-loading" id="frameLoading">جاري التحميل...</div>
        <iframe id="site-frame" sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-popups-to-escape-sandbox"></iframe>
    </div>

            { title: "منصة صحتك تهمنا", type: "منصة", url: "https://www.sehatak.net", desc: "منصة طبية توعوية لنشر المقالات الصحية والنصائح العلاجية الموثوقة." },
            { title: "منصة ريادة الأعمال", type: "منصة", url: "https://www.riyadah.com.sa", desc: "منصة لدعم وتدريب وتمويل المشاريع الناشئة وصغار المستثمرين." },
            { title: "منصة مساق التقنية", type: "منصة", url: "https://www.misaq-tech.com", desc: "منصة لتقديم الدورات البرمجية المتخصصة في أمن المعلومات وتطوير الويب." },
            { title: "Alislamiah Search Console", type: "منصة", url: "https://mohamedmadoui5195.github.io/Alislamiah-search-console/", desc: "لوحة تحكم البحث الخاصة بشبكة الإسلامية." },
            { title: "Alislamiah Services", type: "منصة", url: "https://mohamedmadoui5195.github.io/Alislamiah-services/", desc: "خدمات شبكة الإسلامية المتنوعة." },
            { title: "Alislamiah Net", type: "منصة", url: "https://mohamedmadoui5195.github.io/Alislamiah-_net/", desc: "المنصة الرسمية لشبكة الإسلامية." }
        ];

        // ===================== الوظائف =====================
        function getFavicon(url) {
            try {
                const domain = new URL(url).hostname;
                return `https://www.google.com/s2/favicons?domain=${domain}&sz=128`;
            } catch (e) {
                return 'https://www.google.com/favicon.ico';
            }
        }

        function getAIResponse(query) {
            const q = query.toLowerCase();
            if (q.includes('الإسلامية') || q.includes('alislamiah')) {
                return `تعتبر منصة <strong>الإسلامية</strong> شبكة رقمية متكاملة تقدم خدمات متنوعة تشمل المنصات التعليمية، المتاجر الرقمية، ومساعد الذكاء الاصطناعي لتسهيل الوصول للمحتوى الهادف.`;
            } else if (q.includes('متجر')) {
                return `موقع <strong>متجر الإسلامية</strong> يوفر لك أحدث التطبيقات والمنصات الرقمية الخاصة بشبكة الإسلامية للتحميل والاستخدام المباشر.`;
            } else if (q.includes('أحمد النفيس') || q.includes('النفيس')) {
                return `تعتبر <strong>قناة الشيخ أحمد النفيس</strong> منارة قرآنية مباركة تقدم تلاوات عطرة، خاشعة، ومؤثرة لآي الذكر الحكيم.`;
            } else if (q.includes('فركوس')) {
                return `<strong>قناة الشيخ فركوس</strong> هي القناة الرسمية لفضيلة الشيخ الدكتور محمد علي فركوس، وتضم العديد من الخطب والدروس العلمية القيمة.`;
            } else if (q.includes('أبشر') || q.includes('absher')) {
                return `منصة <strong>أبشر</strong> هي المنصة الإلكترونية الرسمية للخدمات الحكومية للأفراد والقطاع التجاري في السعودية.`;
            } else if (q.includes('ناجز')) {
                return `منصة <strong>ناجز</strong> بوابة الخدمات العدلية والقضائية الإلكترونية لوزارة العدل السعودية.`;
            } else if (q.includes('الجزائر') || q.includes('أولياء')) {
                return `يمكنك متابعة النتائج والمستويات الدراسية عبر المنصات الرسمية المعتمدة في الجزائر مثل <strong>فضاء الأولياء</strong>.`;
            } else {
                return `بناءً على بحثك عن "<strong>${query}</strong>"، تم عرض النتائج المطابقة من قاعدة بيانات شبكة الإسلامية.`;
            }
        }

        function renderResults(query) {
            const resultsList = document.getElementById('resultsList');
            const aiBox = document.getElementById('aiBox');
            const aiText = document.getElementById('aiText');

            if (!query) {
                aiBox.classList.remove('show');
                resultsList.innerHTML = `
                    <div class="no-results">
                        <div class="icon">🔍</div>
                        <p>اكتب كلمة للبحث في قاعدة بيانات الإسلامية</p>
                    </div>`;
                return;
            }

            aiBox.classList.add('show');
            aiText.innerHTML = getAIResponse(query);

            const q = query.toLowerCase().trim();
            const filtered = library.filter(item =>
                (item.title || '').toLowerCase().includes(q) ||
                (item.desc || '').toLowerCase().includes(q) ||
                (item.url || '').toLowerCase().includes(q)
            );

            if (filtered.length === 0) {
                resultsList.innerHTML = `
                    <div class="no-results">
                        <div class="icon">📭</div>
                        <p>عذراً، لم نتمكن من العثور على نتائج مطابقة لـ "<strong>${query}</strong>"</p>
                    </div>`;
                return;
            }

            resultsList.innerHTML = filtered.map(item => {
                if (item.type === 'video' && item.thumbnail) {
                    return `
                    <div class="result-card video-card" onclick="openSite('${item.url}')">
                        <div class="video-thumb">
                            <img src="${item.thumbnail}" alt="" loading="lazy">
                            <span class="video-duration">${item.duration || ''}</span>
                            <div class="video-play">▶</div>
                        </div>
                        <div class="result-body">
                            <div class="result-meta">
                                <span class="result-type">فيديو</span>
                            </div>
                            <div class="result-title">${item.title}</div>
                            <div class="result-desc">${item.desc}</div>
                        </div>
                    </div>`;
                }
                return `
                <div class="result-card" onclick="openSite('${item.url}')">
                    <img class="favicon" src="${getFavicon(item.url)}" alt="" onerror="this.src='https://www.google.com/favicon.ico'" loading="lazy">
                    <div class="result-body">
                        <div class="result-meta">
                            <span class="result-type">${item.type || 'موقع'}</span>
                            <span class="result-url">${item.url.replace(/^https?:\/\//, '')}</span>
                        </div>
                        <div class="result-title">${item.title}</div>
                        <div class="result-desc">${item.desc}</div>
                    </div>
                </div>`;
            }).join('');
        }

        function doSearch(e) {
            e.preventDefault();
            const q = document.getElementById('searchInput').value.trim();
            if (!q) return;
            // إخفاء الإطار وإظهار النتائج
            closeFrame();
            const url = new URL(window.location);
            url.searchParams.set('q', q);
            history.replaceState(null, '', url);
            renderResults(q);
        }

        function openSite(url) {
            const wrap = document.getElementById('site-frame-wrap');
            const frame = document.getElementById('site-frame');
            const loading = document.getElementById('frameLoading');
            const main = document.getElementById('main-content');

            main.classList.add('hidden');
            wrap.classList.add('active');
            loading.style.display = 'flex';
            frame.src = url;

            frame.onload = () => {
                loading.style.display = 'none';
            };
            // في حال فشل التحميل داخل iframe (X-Frame-Options)
            setTimeout(() => {
                if (loading.style.display !== 'none') {
                    // فتح في نافذة جديدة كبديل
                    loading.innerHTML = 'الموقع يمنع العرض داخل الإطار. جاري الفتح في نافذة جديدة...';
                    setTimeout(() => {
                        window.open(url, '_blank');
                        closeFrame();
                    }, 800);
                }
            }, 4000);
        }

        function closeFrame() {
            const wrap = document.getElementById('site-frame-wrap');
            const frame = document.getElementById('site-frame');
            const main = document.getElementById('main-content');
            wrap.classList.remove('active');
            frame.src = 'about:blank';
            main.classList.remove('hidden');
            document.getElementById('frameLoading').style.display = 'flex';
            document.getElementById('frameLoading').innerHTML = 'جاري التحميل...';
        }

        function goBack() {
            const wrap = document.getElementById('site-frame-wrap');
            if (wrap.classList.contains('active')) {
                closeFrame();
            } else {
                if (history.length > 1) history.back();
                else goHome();
            }
        }

        function goHome() {
            window.location.href = 'index.html';
        }

        // عند التحميل
        document.addEventListener('DOMContentLoaded', () => {
            const params = new URLSearchParams(window.location.search);
            const q = params.get('q') || '';
            document.getElementById('searchInput').value = q;
            renderResults(q);
        });
    </script>
</body>
